<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>grid-pic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>grid-pic</h1>
  <label class="btn primary" for="file">Wybierz zdjęcie</label>
  <input id="file" type="file" accept="image/*" hidden>
</header>

<main>
  <div id="stage">
    <canvas id="canvas" width="800" height="600"></canvas>
    <p id="hint">Wybierz zdjęcie lub grafikę, aby nałożyć siatkę.</p>
  </div>

  <section id="panel">
    <div class="row">
      <label>Kolumny <output id="colsOut">4</output></label>
      <input id="cols" type="range" min="1" max="40" value="4">
    </div>
    <div class="row">
      <label>Rzędy <output id="rowsOut">4</output></label>
      <input id="rows" type="range" min="1" max="40" value="4">
    </div>
    <div class="row">
      <label>Grubość linii <output id="thickOut">2</output></label>
      <input id="thick" type="range" min="1" max="20" value="2">
    </div>
    <div class="row inline">
      <label for="color">Kolor siatki</label>
      <input id="color" type="color" value="#ffffff">
    </div>
    <div class="row inline">
      <label for="labels">Oznaczenia kratek (A1, B1…)</label>
      <input id="labels" type="checkbox">
    </div>
    <div class="row inline">
      <label for="gray">Skala szarości</label>
      <input id="gray" type="checkbox">
    </div>
    <div class="row">
      <label>Kontrast <output id="contrastOut">0</output></label>
      <input id="contrast" type="range" min="-100" max="100" value="0">
    </div>
    <div class="actions">
      <button id="reset" class="btn">Resetuj</button>
      <button id="save" class="btn primary" disabled>Zapisz obraz</button>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
